seed: 42

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  artifacts: artifacts
  reports: reports

data:
  required_files: [train_transaction.csv, train_identity.csv]
  optional_files: [test_transaction.csv, test_identity.csv]
  required_columns:
    transaction: [TransactionID, isFraud, TransactionDT, TransactionAmt, ProductCD, card1, card2,
                  card5, addr1, P_emaildomain, R_emaildomain, D1]
    identity: [TransactionID, DeviceType, DeviceInfo]
  # Explicit dtype map. TransactionID, TransactionDT and isFraud are integers; every column
  # not listed here is read as float32.
  dtypes:
    float64: [TransactionAmt]
    category: [ProductCD, card4, card6, P_emaildomain, R_emaildomain,
               M1, M2, M3, M4, M5, M6, M7, M8, M9,
               id_12, id_15, id_16, id_23, id_27, id_28, id_29, id_30, id_31, id_33, id_34,
               id_35, id_36, id_37, id_38, DeviceType, DeviceInfo]

split: {train: 0.60, validation: 0.20, test: 0.20, gap_days: 7}

features:
  rare_level_share: 0.001
  max_levels_without_grouping: 50
  frequency_encode: [card1, addr1, P_emaildomain, DeviceInfo, UID]
  v_corr_threshold: 0.75
  history_windows_hours: [1, 24, 168]
  min_prior_for_zscore: 3
  label_features: {enabled: false, label_delay_days: 30}

rules: {file: config/rules.yaml}

models:
  imbalance_strategies: [none, scale_pos_weight, undersample_1_5]
  undersample_ratio: 5
  # Policy whose validation VDR picks the imbalance strategy (FR-5.3).
  selection_policy: expected_loss
  optuna_trials: 40
  calibration: isotonic
  num_boost_round: 2000
  early_stopping_rounds: 100
  logreg_max_iter: 200
  lgbm:
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 100
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0

budget:
  default_k: 100
  sensitivity_k: [25, 50, 100, 200, 400]
  policies: [probability, expected_loss, fixed_threshold, rules]

# ASSUMPTIONS - label as such in all reports
costs:
  review_cost_per_alert_inr: 150
  friction_cost_per_fp_inr: 50
  recovery_rate: 0.90
  inr_per_unit: 85.0

explain: {shap_background: 5000, top_reasons: 3, top_global: 25}

evaluation:
  psi_warn: 0.10
  psi_alert: 0.25
  amount_bands: 5
  segment_flag_ratio: 0.5
  missed_top_n: 20
  review_cost_multipliers: [0.5, 1.0, 2.0]

targets: {pr_auc: 0.45, roc_auc: 0.88, vdr_uplift_vs_rules_pp: 10}

api:
  model_version: "1.0.0"
  risk_levels: {medium: 0.10, high: 0.30}
  allow_reset: false
  p95_latency_ms: 100
  parity_rows: 2000
  parity_tolerance: 1.0e-6
  latency_requests: 1000

# Overrides used by `smoke`: synthetic data, small model, small budget.
smoke:
  transactions: 20000
  uids: 1500
  days: 60
  optuna_trials: 2
  num_boost_round: 200
  default_k: 10
  sensitivity_k: [5, 10, 20]
  shap_background: 1000
  parity_rows: 200
  latency_requests: 100
