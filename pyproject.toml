[project]
name = "fraud-alert-budget"
version = "0.1.0"
description = "Card-transaction fraud detection under a fixed alert budget"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.1,<3",
    "numpy",
    "pyarrow",
    "pandera[pandas]",
    "scikit-learn",
    "lightgbm",
    "optuna",
    "shap",
    # Floor stops the resolver picking an old numba (via shap) that cannot build on 3.11.
    "numba>=0.59",
    "fastapi",
    "pydantic>=2",
    "uvicorn",
    "streamlit",
    "matplotlib",
    "jinja2",
    "pyyaml",
    "markdown",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
    "types-PyYAML",
    "types-markdown>=3.11.3.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["fraud"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src", "app", "tests"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
